<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e50">
  <meta name="description" content="মসজিদের নামাজের সময়, নিকটবর্তী মসজিদ ও বিজ্ঞপ্তি।">
  <title>সালাত — নামাজের সময়</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <!-- Inline SVG symbols avoid external SVG <use> compatibility and CORS issues. -->
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mosque" viewBox="0 0 24 24"><path d="M3 21h18M5 21v-9h14v9M8 12V9l4-4 4 4v3M12 5V2M9 16h.01M15 16h.01M12 21v-5M3 12c2-2 4-2 6 0 2-2 4-2 6 0 2-2 4-2 6 0" /></symbol>
    <symbol id="i-fajr" viewBox="0 0 24 24"><path d="M3 18h18M5 22h14M12 3v3M5 7l2 2M19 7l-2 2M4 13h2M18 13h2M8 18a4 4 0 0 1 8 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M3 18h18M5 22h14M12 3v3M5 7l2 2M19 7l-2 2M4 13h2m12 0h2M8 18a4 4 0 0 1 8 0"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/><path d="m17 3 .5 1.5L19 5l-1.5.5L17 7l-.5-1.5L15 5l1.5-.5L17 3Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  </svg>

  <div class="app">
    <header class="hero">
      <div class="hero-toolbar">
        <div class="brand">
          <div class="brand-mark"><svg class="svg-icon"><use href="#i-mosque"/></svg></div>
          <div><strong>সালাত</strong></div>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="তথ্য রিফ্রেশ" title="রিফ্রেশ"><svg class="svg-icon"><use href="#i-refresh"/></svg></button>
      </div>
      <div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div>
    </header>

    <main class="main-content">
      <section class="page active" id="timesPage" aria-labelledby="timesHeading">
        <div class="section-heading"><div><h2 id="timesHeading">আজকের নামাজের সময়সূচি</h2></div></div>
        <article class="next-card">
          <div class="next-card-top"><span class="next-label"><svg class="svg-icon"><use href="#i-clock"/></svg> পরবর্তী নামাজ</span></div>
          <div class="next-card-bottom"><div><h3 id="nextPrayerName">যোহর</h3></div><strong id="nextPrayerTime">১২:১৫ PM</strong></div>
          <div class="progress-track" aria-hidden="true"><span></span></div>
        </article>
        <div class="prayer-list" id="prayerList"></div>
      </section>

      <section class="page" id="mosquesPage" aria-labelledby="mosquesHeading">
        <div class="section-heading"><div><h2 id="mosquesHeading">নিকটবর্তী মসজিদ</h2><p>নাম অথবা এলাকা দিয়ে খুঁজুন</p></div></div>
        <form class="search-form" id="mosqueSearchForm" role="search"><label class="search-box"><svg class="svg-icon"><use href="#i-search"/></svg><input id="mosqueSearch" type="search" placeholder="মসজিদের নাম বা এলাকা" aria-label="মসজিদের নাম বা এলাকা"></label><button type="submit" class="primary-button">খুঁজুন</button></form>
        <div id="mosqueResults" aria-live="polite"></div>
        <div class="disclaimer"><svg class="svg-icon"><use href="#i-info"/></svg><p>এগুলো নমুনা মসজিদ। প্রকৃত দূরত্ব ও অবস্থান দেখাতে লোকেশন অনুমতি এবং যাচাইকৃত মসজিদ ডেটাবেস প্রয়োজন।</p></div>
      </section>

      <section class="page" id="noticesPage" aria-labelledby="noticesHeading">
        <div class="section-heading"><div><h2 id="noticesHeading">বিজ্ঞপ্তি</h2><p>মসজিদের ঘোষণা ও গুরুত্বপূর্ণ তথ্য</p></div><span class="status-pill">সর্বশেষ</span></div>
        <div class="notice-list" id="noticeResults" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="প্রধান নেভিগেশন">
      <button class="nav-item active" type="button" data-page="timesPage" aria-current="page"><span class="nav-icon"><svg class="svg-icon"><use href="#i-clock"/></svg></span><span>নামাজের সময়</span></button>
      <button class="nav-item" type="button" data-page="mosquesPage"><span class="nav-icon"><svg class="svg-icon"><use href="#i-pin"/></svg></span><span>নিকটবর্তী মসজিদ</span></button>
      <button class="nav-item" type="button" data-page="noticesPage"><span class="nav-icon"><svg class="svg-icon"><use href="#i-bell"/></svg></span><span>বিজ্ঞপ্তি</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
